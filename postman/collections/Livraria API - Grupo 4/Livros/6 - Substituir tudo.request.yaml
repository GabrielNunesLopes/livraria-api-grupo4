$kind: http-request
url: "{{baseUrl}}/livros/{{livroId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titulo": "O Hobbit",
      "autor": "J.R.R. Tolkien",
      "preco": 42,
      "estoque": 8
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 6000
