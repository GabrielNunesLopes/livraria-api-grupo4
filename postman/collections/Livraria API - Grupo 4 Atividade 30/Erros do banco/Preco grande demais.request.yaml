$kind: http-request
url: "{{baseUrl}}/livros"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "titulo": "O Livro Mais Caro", "autor": "Ninguem", "preco": 123456789012, "estoque": 1 }'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 2000
